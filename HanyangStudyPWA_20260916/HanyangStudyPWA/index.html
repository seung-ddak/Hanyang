<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0b1110" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="면접공부" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="assets/icon-180.png" />
  <link rel="stylesheet" href="styles.css" />
  <title>한양대 면접 공부</title>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">HANYANG INTERVIEW STUDY</p>
        <h1>내 진도</h1>
      </div>
      <button id="installHelp" class="icon-btn" aria-label="아이폰 설치 방법">＋</button>
    </header>

    <section id="hero" class="hero card">
      <div class="hero-row">
        <div>
          <p id="stageLabel" class="muted">불러오는 중…</p>
          <h2 id="title">학습 계획</h2>
          <p id="subtitle" class="muted"></p>
        </div>
        <div class="ring" id="progressRing"><span id="progressText">0%</span></div>
      </div>
      <div class="progress-track"><div id="progressBar" class="progress-fill"></div></div>
      <div class="hero-actions">
        <button id="openCurrentLesson" class="primary">현재 교재 열기</button>
        <button id="snooze" class="secondary">60분 뒤 알림</button>
      </div>
    </section>

    <section id="yesterdayCard" class="card hidden">
      <div class="section-head"><h3>어제 못 끝낸 공부</h3><span id="yesterdayCount" class="pill"></span></div>
      <div id="yesterdayTasks" class="compact-list"></div>
    </section>

    <section class="card">
      <div class="section-head"><h3>현재 단계</h3><span id="remainingBadge" class="pill"></span></div>
      <div id="tasks" class="task-list"></div>
    </section>

    <section class="card">
      <div class="section-head"><h3>메모</h3><span class="muted small">자동 저장</span></div>
      <textarea id="note" rows="5" placeholder="막힌 질문, 다시 볼 내용, 면접 답변 포인트를 적어 두세요."></textarea>
    </section>

    <section class="card">
      <div class="section-head calendar-head">
        <button id="prevMonth" class="ghost">‹</button>
        <h3 id="monthLabel">달력</h3>
        <button id="nextMonth" class="ghost">›</button>
      </div>
      <div class="weekday-row"><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span><span>일</span></div>
      <div id="calendar" class="calendar-grid"></div>
      <p class="legend"><span class="dot complete"></span>완료 <span class="dot partial"></span>일부 <span class="dot missed"></span>미완료 <span class="dot locked"></span>잠김</p>
    </section>

    <section class="card">
      <div class="section-head"><h3>교재</h3><span class="muted small">오프라인 캐시 지원</span></div>
      <div class="resource-grid">
        <button id="openUnlocked" class="secondary">열린 장 보기</button>
        <a class="secondary link-btn" href="lessons.html" target="_blank" rel="noopener">전체 HTML</a>
        <a class="secondary link-btn" href="full_guide.pdf" target="_blank" rel="noopener">전체 PDF</a>
      </div>
    </section>

    <section class="card settings-card">
      <div class="section-head"><h3>설정</h3></div>
      <label>시작일<input id="startDate" type="date"></label>
      <label>면접일<input id="interviewDate" type="date"></label>
      <label class="toggle-row"><input id="sequentialUnlock" type="checkbox"><span>이전 단계 완료 후 다음 단계 해제</span></label>
      <button id="resetProgress" class="danger">학습 기록 초기화</button>
    </section>

    <footer>진도는 이 iPhone의 브라우저 저장소에 저장됩니다.</footer>
  </main>

  <dialog id="modal">
    <div class="modal-card">
      <div class="section-head"><h3 id="modalTitle">안내</h3><button id="closeModal" class="ghost">✕</button></div>
      <div id="modalBody"></div>
    </div>
  </dialog>

  <script src="app.js" defer></script>
</body>
</html>
