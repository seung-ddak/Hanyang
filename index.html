<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08100f"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="reader.css"><title>한양대 면접 공부</title></head><body>
<main class="workspace"><aside id="widget"><header><p class="eyebrow">HANYANG INTERVIEW STUDY</p><h1>내 진도</h1></header>
<div class="card"><nav class="actions"><button id="prev">‹ 이전</button><button id="current">내 진도</button><button id="next">다음 ›</button></nav><p id="stageLabel" class="muted"></p><h2 id="title">불러오는 중…</h2><p id="scope"></p><progress id="progress" max="5" value="0"></progress><p id="count"></p><div id="tasks"></div><button id="unlock" class="primary">다음 단계 해금 →</button><p id="gate" class="muted"></p></div>
<details class="card"><summary>기기 간 동기화 · 설정</summary><p id="syncStatus" role="status">이 기기에 저장됨</p><label>비공개 저장소<input id="repo" value="seung-ddak/Hanyang" readonly></label><label id="tokenLabel">GitHub 접근 토큰<input id="token" type="password" autocomplete="off" placeholder="이 탭에서만 사용"></label><p id="tokenHelp" class="muted">이 저장소의 Contents 읽기·쓰기 권한이 있는 fine-grained 토큰을 입력하세요. 토큰은 파일이나 저장소에 저장하지 않습니다.</p><button id="sync" class="primary">연결하고 동기화</button><button id="disconnect">연결 해제</button><label>학습 시작일<input id="start" type="date"></label><label>면접일<input id="exam" type="date"></label><button id="export">기록 백업 다운로드</button><label>백업 가져오기<input id="import" type="file" accept="application/json"></label><p>날짜는 계획상의 일정입니다. 이전 단계 완료 후 해금 버튼으로 진행합니다.</p></details><p id="status" role="status"></p></aside><article id="reader"><div class="card">교재를 불러오는 중입니다.</div></article></main><script src="progress.js"></script><script src="lesson_scope.js"></script><script src="app.js"></script></body></html>
